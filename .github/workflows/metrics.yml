name: Metrics

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: .github/assets/metrics.svg
          committer_branch: output
          output_condition: changes
          committer_message: "chore(metrics): update metrics.svg [skip ci]"
          config_timezone: Asia/Shanghai
          base: ""
          plugins_errors_fatal: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_ignored: html, css, scss

          plugin_rss: yes
          plugin_rss_source: https://albusphos.github.io/AlbusPhos/blog/rss.xml
          plugin_rss_limit: 3

          plugin_stars: yes
          plugin_stars_limit: 3
