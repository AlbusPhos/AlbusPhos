name: Metrics

on:
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: .github/assets/metrics.svg
          committer_branch: main
          committer_message: "chore(metrics): update metrics.svg [skip ci]"
          config_timezone: Asia/Shanghai
          base: ""
          plugins_errors_fatal: no


          # 等距提交日历（使用 half-year 避免 3D 日历过长遮挡右侧文字）
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 语言活动（Languages activity）
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_colors: github
          plugin_languages_ignored: html, css, scss, less, astro, mdx, tex, dockerfile, makefile, cmake

          # 最近 star 的仓库（修正参数名：是 plugin_stars 而不是 plugin_starred）
          plugin_stars: yes
          plugin_stars_limit: 5
